<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP32-CAM Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h2>📷 ESP32-CAM Live Stream</h2>
  <img id="stream" src="" alt="Kein Stream aktiv">
  <div>
    <button id="toggleBtn">▶️ Start Stream</button>
    <button id="captureBtn">📸 Screenshot</button>
  </div>
  <footer>Powered by ESP32-CAM</footer>
  
  <script>
    const img = document.getElementById('stream');
    const toggleBtn = document.getElementById('toggleBtn');
    const captureBtn = document.getElementById('captureBtn');
    let streaming = false;

    toggleBtn.onclick = () => {
      if (!streaming) {
        img.src = '/stream';
        toggleBtn.textContent = '⏸️ Stop Stream';
        streaming = true;
      } else {
        img.src = '';
        toggleBtn.textContent = '▶️ Start Stream';
        streaming = false;
      }
    };

    captureBtn.onclick = () => {
      const link = document.createElement('a');
      link.href = '/capture';
      link.download = 'esp32cam.jpg';
      link.click();
    };
  </script>
</body>
</html>
