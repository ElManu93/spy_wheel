<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ESP32-CAM Steuerung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h2>Menü</h2>
    <ul>
      <li><a href="#">Start</a></li>
      <li><a href="#">LED Steuerung</a></li>
      <li><a href="#">Kamera</a></li>
    </ul>
  </div>

  <div class="content">
    <h1>ESP32-CAM LED & Kamera</h1>

    <div>
      <button onclick="toggleLED('on')">LED AN</button>
      <button onclick="toggleLED('off')">LED AUS</button>
    </div>

    <h2>Live-Kamera</h2>
    <img id="cameraStream" src="/camera" alt="Kameraansicht" width="480">

    <script>
      function toggleLED(state) {
        fetch('/led/' + state)
          .then(response => response.text())
          .then(data => console.log(data));
      }

      // Bild regelmäßig neu laden (z. B. alle 2 Sekunden)
      setInterval(() => {
        const img = document.getElementById("cameraStream");
        img.src = "/camera?" + new Date().getTime(); // Cache verhindern
      }, 2000);
    </script>
  </div>
</body>
</html>
