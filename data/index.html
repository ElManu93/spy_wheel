<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP32-CAM Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h2>📷 ESP32-CAM Live Stream</h2>
  <img id="stream" src="" alt="No active stream" />
  <div>
    <button id="toggleBtn">▶️ Start Stream</button>
    <button id="ledBtn">💡 LED Toggle</button>
  </div>
  <footer>Powered by ESP32-CAM</footer>
  
  <script>
    const img = document.getElementById('stream');
    const toggleBtn = document.getElementById('toggleBtn');
    const ledBtn = document.getElementById('ledBtn');
    let streaming = false;

    toggleBtn.onclick = () => {
      if (!streaming) {
        img.src = '/stream';
        toggleBtn.textContent = '⏸️ Stop Stream';
        streaming = true;
      } else {
        img.src = '';
        toggleBtn.textContent = '▶️ Start Stream';
        streaming = false;
      }
    };

    ledBtn.onclick = async () => {
      try {
        const response = await fetch('/led/toggle');
        const text = await response.text();
        console.log(text); // Ausgabe im Browser-Console-Fenster
        alert(text);       // optional Popup, zeigt AN/AUS
      } catch (err) {
        console.error("Fehler beim Toggle:", err);
      }
    };
  </script>
</body>
</html>
