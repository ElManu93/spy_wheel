<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ESP32 LED Steuerung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h2>Menü</h2>
    <ul>
      <li><a href="#">Start</a></li>
      <li><a href="#">LED Steuerung</a></li>
      <li><a href="#">Einstellungen</a></li>
    </ul>
  </div>

  <div class="content">
    <h1>ESP32 LED Steuerung</h1>
    <button onclick="toggleLED('on')">LED AN</button>
    <button onclick="toggleLED('off')">LED AUS</button>
  </div>

  <script>
    function toggleLED(state) {
      fetch('/led/' + state)
        .then(response => response.text())
        .then(data => console.log(data));
    }
  </script>
</body>
</html>
